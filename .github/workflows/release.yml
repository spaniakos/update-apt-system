name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview packages or create/populate a draft release'
        type: choice
        options: [preview, create-draft]
        default: preview
        required: true
      tag:
        description: 'For create-draft: enter vX.Y.Z matching VERSION'
        type: string
        default: ''
        required: false
permissions:
  contents: read
concurrency:
  group: updateself-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate-ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.request.outputs.enabled }}
      tag: ${{ steps.request.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version and release request
        id: request
        env:
          RELEASE_MODE: ${{ inputs.mode || 'preview' }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          bash scripts/check.sh
          python3 scripts/release_draft.py validate
  build:
    needs: validate-ref
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  draft-release:
    needs: [validate-ref, build]
    if: needs.validate-ref.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-preview
          path: dist
      - name: Verify downloaded release checksums
        run: (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create tag and populate draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-ref.outputs.tag }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 scripts/release_draft.py populate --tag "$TAG" --revision "$SOURCE_REVISION" --directory dist
